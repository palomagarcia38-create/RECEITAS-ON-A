<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#23654c"><title>RECEITAS ONÇA</title><link rel="stylesheet" href="style.css?v=onca-4"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/maria-carmela-192.png"></head>
<body class="sketch-layout"><header><a class="brand" href="#"><img class="brand-portrait" src="images/maria-carmela.webp" alt="Retrato da vó Maria Carmela"><span>RECEITAS ONÇA<small>O CADERNO DA VÓ MARIA CARMELA</small></span></a></header>
<main><nav class="recipe-tools" aria-label="Organizar receitas"><button id="sort-az" class="tool active" aria-pressed="true"><span aria-hidden="true">A–Z</span>De A–Z</button><button id="by-ingredient" class="tool" aria-pressed="false"><span aria-hidden="true">🥕</span>Por ingrediente</button><button class="tool add-tool" id="new"><span aria-hidden="true">＋</span>Adicionar receita</button></nav><label class="search"><input id="search" placeholder="Pesquisar receita ou ingrediente…" aria-label="Pesquisar receitas por nome ou ingrediente"><button id="search-button" aria-label="Pesquisar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button></label><section class="collection" id="collection"><div class="section-title"><h1><span id="count">0</span> receitas</h1><span id="search-mode">Nome ou ingrediente · A–Z</span></div><div id="filters" hidden><button data-category="Todas">Todas</button></div><div id="recipes" class="grid"></div></section><aside class="storage"><div><strong>Guarde uma cópia do seu livro</strong><p>Receitas, fotos e vídeos ficam neste aparelho.</p></div><div class="backup-actions"><button id="backup" class="quiet">↗ Exportar</button><button id="import" class="quiet">↓ Importar</button></div><input type="file" id="import-file" accept="application/json" hidden></aside></main><footer>RECEITAS ONÇA <span>Com o carinho da Maria Carmela ♡</span></footer>
<dialog id="editor"><form id="form"><div class="modal-head"><div><span class="eyebrow">UMA NOVA LEMBRANÇA</span><h2 id="editor-title">Adicionar receita</h2></div><button type="button" class="close" aria-label="Fechar">×</button></div><label>Nome da receita<input name="title" required maxlength="120" placeholder="Como a vó chamava essa receita?"></label><div class="fields"><label>Categoria<select name="category"><option>Doces</option><option>Salgados</option><option>Pratos principais</option><option>Outros</option></select></label><label>Tempo de preparo<input name="time" maxlength="50" placeholder="Ex.: 45 minutos"></label><label>Rendimento<input name="yield" maxlength="50" placeholder="Ex.: 8 porções"></label></div><label>Ingredientes<textarea name="ingredients" required rows="5" placeholder="Um ingrediente por linha"></textarea></label><label>Modo de preparo<textarea name="steps" required rows="6" placeholder="Um passo por linha"></textarea></label><div class="fields"><label>Foto do prato pronto<input name="photo" type="file" accept="image/*"><small>Escolha uma foto para a capa.</small></label><label>Seu vídeo preparando a receita<input name="video" type="file" accept="video/*"><small>Vídeo de até 100 MB.</small></label></div><label>Dicas e memórias da vó<textarea name="notes" rows="3" placeholder="O segredo dela, uma história, uma lembrança…"></textarea></label><p id="form-error" role="alert"></p><div class="actions"><button type="button" class="quiet close">Cancelar</button><button class="primary" type="submit">Guardar receita ♡</button></div></form></dialog>
<dialog id="detail"><div id="detail-content"></div></dialog><div id="toast" role="status"></div><script src="app.js?v=onca-4"></script><script src="pwa.js?v=onca-4"></script></body></html>
