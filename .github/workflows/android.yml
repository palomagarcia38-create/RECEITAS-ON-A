name: Gerar APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Preparar arquivo instalável
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RECEITAS-ONCA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RECEITAS-ONCA-Android
          path: RECEITAS-ONCA.apk
      - name: Disponibilizar download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" RECEITAS-ONCA.apk --target "$GITHUB_SHA" --title 'RECEITAS ONÇA · Android' --notes 'APK de teste para Android 8 ou superior. Dados locais. Não migra automaticamente receitas do navegador. Assinado com chave de depuração; futuras versões podem exigir migração por mudança de assinatura.'
